<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memento</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; }
  body {
    max-width: 720px; margin: 0 auto; padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fafafa; color: #222;
  }
  h1 { font-size: 20px; margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; }
  textarea {
    width: 100%; min-height: 72px; padding: 8px; font: inherit;
    border: 1px solid #ccc; border-radius: 6px; resize: vertical;
  }
  button {
    padding: 6px 14px; font: inherit; border: 1px solid #ccc;
    border-radius: 6px; background: #fff; cursor: pointer;
  }
  button.primary { background: #222; color: #fff; border-color: #222; }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.danger { color: #c00; border-color: #e0b0b0; }
  .new-box { margin-bottom: 24px; }
  .new-box button { margin-top: 8px; }
  .memory {
    background: #fff; border: 1px solid #e2e2e2; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .memory .date { font-size: 12px; color: #888; margin-bottom: 4px; }
  .memory .content { white-space: pre-wrap; word-break: break-word; }
  .memory .actions { margin-top: 8px; }
  .memory .actions button { font-size: 13px; padding: 3px 10px; margin-right: 6px; }
  #login { max-width: 320px; margin: 120px auto; text-align: center; }
  #login input {
    width: 100%; padding: 8px; font: inherit; margin-bottom: 8px;
    border: 1px solid #ccc; border-radius: 6px;
  }
  .error { color: #c00; font-size: 13px; }
  .empty { color: #888; text-align: center; padding: 40px 0; }
  .brand { display: flex; align-items: center; gap: 6px; }
  .brand svg { width: 22px; height: 22px; flex: none; }
  #logoutBtn {
    width: 30px; height: 30px; padding: 0; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #444;
  }
  #sync { font-size: 12px; color: #888; font-weight: normal; margin-right: 8px; }
  .memory.pending { opacity: 0.55; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #c00; color: #fff; padding: 8px 16px;
    border-radius: 6px; font-size: 13px; z-index: 10;
  }
  .pager {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; margin: 16px 0 8px; font-size: 13px; color: #666;
  }
  .pager button { font-size: 13px; padding: 3px 10px; }
  .pin-bar {
    width: 100%; display: flex; align-items: center; gap: 6px;
    margin-bottom: 10px; padding: 8px 14px; font-size: 13px; color: #555;
    background: #fff; border: 1px solid #e2e2e2; border-radius: 8px;
  }
  .memory.pinned-card { border-left: 3px solid #222; }
  #pinList { margin-bottom: 10px; }
  #pinList .memory { margin-bottom: 8px; }
</style>
</head>
<body>

<div id="login" hidden>
  <h1 style="justify-content:center"><span class="brand">Memento <svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#222" fill-rule="evenodd" d="M12 32a17 10.5 0 1 0 34 0 17 10.5 0 1 0-34 0ZM17.9 29a2.6 2.6 0 1 0 5.2 0 2.6 2.6 0 1 0-5.2 0Z"/><path fill="#222" d="M43 32l13-9v18z"/></svg></span></h1>
  <form id="loginForm">
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password" required>
    <button class="primary" type="submit" style="width:100%">登录</button>
    <p class="error" id="loginErr"></p>
  </form>
</div>

<main id="app" hidden>
  <h1><span class="brand">Memento <svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#222" fill-rule="evenodd" d="M12 32a17 10.5 0 1 0 34 0 17 10.5 0 1 0-34 0ZM17.9 29a2.6 2.6 0 1 0 5.2 0 2.6 2.6 0 1 0-5.2 0Z"/><path fill="#222" d="M43 32l13-9v18z"/></svg></span><span><span id="sync" hidden>同步中…</span><button id="logoutBtn" hidden title="退出登录"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg></button></span></h1>
  <div class="new-box">
    <textarea id="newContent" placeholder="记一条……"></textarea>
    <button class="primary" id="addBtn">保存</button>
  </div>
  <button id="pinBar" class="pin-bar" hidden><span id="pinArrow">▶</span> 置顶记忆（<span id="pinCount">0</span> 条）</button>
  <div id="pinList"></div>
  <div id="list"></div>
  <div id="pager" class="pager" hidden></div>
</main>
<div id="toast" hidden></div>

<script>
const $ = (s) => document.querySelector(s);

// 本地状态是渲染的唯一来源：写操作先改本地、立即渲染，请求放后台队列串行执行，
// 回来后再拉全量对账，因此跨洋高延迟不会阻塞操作。
let state = [];
let editing = null;              // 正在编辑的卡片 {key, value}，保证后台刷新不打断输入
const pendingIds = {};           // 乐观新增的临时 key → 服务端 id
let queue = Promise.resolve();   // 写请求串行队列，防止并发乱序
let inFlight = 0;                // 队列中未完成的请求数，驱动"同步中"指示
const PAGE_SIZE = 10;            // 列表每页条数（置顶板块不计入分页）
let page = 1;
let pinnedOpen = false;          // 置顶板块默认折叠，条上显示数量

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!res.ok) {
    let msg = res.statusText || `HTTP ${res.status}`;
    try { msg = (await res.json()).detail || msg; } catch {}
    if (res.status === 429) msg = "尝试太频繁，请稍后再试";  // nginx 返回的 429 是 HTML 页、statusText 为空
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}

function showLogin() {
  $("#login").hidden = false;
  $("#app").hidden = true;
}

function showApp() {
  $("#login").hidden = true;
  $("#app").hidden = false;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function updateSyncUI() {
  $("#sync").hidden = inFlight === 0;
}

// 写操作进队列串行执行；单条失败不阻断后续，错误提示与回滚由 op 自己处理
function enqueue(op) {
  inFlight++;
  updateSyncUI();
  queue = queue.then(op).catch(() => {}).finally(() => {
    inFlight--;
    updateSyncUI();
  });
}

// 服务端时间戳格式（东八区）的本地近似，仅用于乐观渲染占位，同步后以服务端为准
function nowShanghai() {
  const n = new Date();
  const s = new Date(n.getTime() + (n.getTimezoneOffset() + 480) * 60000);
  const p = (x) => String(x).padStart(2, "0");
  return `${s.getUTCFullYear()}-${p(s.getUTCMonth() + 1)}-${p(s.getUTCDate())} ` +
    `${p(s.getUTCHours())}:${p(s.getUTCMinutes())}:${p(s.getUTCSeconds())}`;
}

// 与服务端 ORDER BY pinned DESC, updated_at DESC, id DESC 一致
function cmpServer(a, b) {
  if (!!b.pinned !== !!a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
  if (a.updated_at !== b.updated_at) return a.updated_at < b.updated_at ? 1 : -1;
  if (a.id === b.id) return 0;
  return a.id < b.id ? 1 : -1;
}

function insertByOrder(arr, item) {
  const i = arr.findIndex((m) => cmpServer(m, item) > 0);
  arr.splice(i === -1 ? arr.length : i, 0, item);
}

function cardHTML(m) {
  if (editing && editing.key === m.key) {
    return `
    <div class="memory" data-key="${esc(m.key)}">
      <textarea>${esc(editing.value)}</textarea>
      <div class="actions">
        <button class="primary saveBtn">保存</button>
        <button class="cancelBtn">取消</button>
      </div>
    </div>`;
  }
  // 显示创建日期（改过的话补一个更新日期）；排序用 updated_at，与服务端 ORDER BY 一致
  const created = (m.created_at || "").slice(0, 10);
  const updated = (m.updated_at || "").slice(0, 10);
  const stamp = created && created !== updated ? `${created}→${updated}` : created || updated;
  const dateLine = m.pending ? "同步中…" : `${esc(stamp)} · #${esc(m.id)}`;
  const cls = `${m.pending ? " pending" : ""}${m.pinned ? " pinned-card" : ""}`;
  return `
    <div class="memory${cls}" data-key="${esc(m.key)}">
      <div class="date">${dateLine}</div>
      <div class="content">${esc(m.content)}</div>
      <div class="actions"><button class="editBtn">编辑</button><button class="danger delBtn">删除</button></div>
    </div>`;
}

function render() {
  // 置顶板块：默认折叠，条上显示置顶数量
  const pinnedItems = state.filter((m) => !!m.pinned);
  const normalItems = state.filter((m) => !m.pinned);
  const bar = $("#pinBar");
  if (pinnedItems.length) {
    bar.hidden = false;
    $("#pinCount").textContent = pinnedItems.length;
    $("#pinArrow").textContent = pinnedOpen ? "▼" : "▶";
    $("#pinList").innerHTML = pinnedOpen ? pinnedItems.map(cardHTML).join("") : "";
  } else {
    bar.hidden = true;
    $("#pinList").innerHTML = "";
  }

  const list = $("#list");
  const pager = $("#pager");
  if (!normalItems.length) {
    list.innerHTML = state.length
      ? '<div class="empty">没有更多记忆了</div>'
      : '<div class="empty">还没有任何记忆</div>';
    pager.hidden = true;
    pager.innerHTML = "";
  } else {
    const totalPages = Math.max(1, Math.ceil(normalItems.length / PAGE_SIZE));
    if (page > totalPages) page = totalPages; // 删除后页数收缩，收敛页码
    list.innerHTML = normalItems
      .slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE)
      .map(cardHTML).join("");
    if (totalPages > 1) {
      pager.hidden = false;
      pager.innerHTML =
        `<button id="prevPage" ${page <= 1 ? "disabled" : ""}>上一页</button>` +
        `<span>第 ${page} / ${totalPages} 页 · 共 ${normalItems.length} 条</span>` +
        `<button id="nextPage" ${page >= totalPages ? "disabled" : ""}>下一页</button>`;
    } else {
      pager.hidden = true;
      pager.innerHTML = "";
    }
  }
  if (editing) {
    const ta = document.querySelector(`[data-key="${editing.key}"] textarea`);
    if (ta) {
      if (editing.height) ta.style.height = editing.height + "px";
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }
}

// 拉服务端全量对账；尚未被服务端确认的乐观条目保留本地（按服务端顺序插入）
async function load() {
  const data = await api("/api/memories");
  const serverItems = data.map((m) => ({ ...m, key: m.id, pending: false }));
  const carried = [];
  for (const p of state) {
    if (!p.pending) continue;
    const rid = pendingIds[p.key];
    if (rid && serverItems.some((m) => m.id === rid)) continue; // 服务端已有，以服务端为准
    carried.push(p);
  }
  state = serverItems;
  for (const p of carried) insertByOrder(state, p);
  render();
}

let toastTimer = null;
function showError(msg) {
  const t = $("#toast");
  t.textContent = `操作失败：${msg}（已恢复服务端状态）`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
}

// 乐观新增：立即上屏（半透明 + "同步中…"），后台落库
$("#addBtn").addEventListener("click", () => {
  const content = $("#newContent").value.trim();
  if (!content) return;
  $("#newContent").value = "";
  const item = {
    key: `tmp-${Math.random().toString(36).slice(2, 8)}`,
    id: "",
    content,
    created_at: "",
    updated_at: nowShanghai(),
    pinned: 0,
    pending: true,
  };
  insertByOrder(state, item);
  page = 1; // 新记忆排在最前，跳回第一页
  render();
  enqueue(async () => {
    try {
      const res = await api("/api/memories", { method: "POST", body: JSON.stringify({ content }) });
      pendingIds[item.key] = res.id;
      if (state.includes(item)) {
        item.id = res.id;
        item.pending = false;
      }
      await load();
    } catch (err) {
      // 新增失败：撤下乐观卡片，输入内容归还文本框
      if (state.includes(item)) state.splice(state.indexOf(item), 1);
      if (!$("#newContent").value.trim()) $("#newContent").value = content;
      render();
      showError(err.message);
    }
  });
});

// 编辑中的输入实时同步到 editing，后台对账刷新后原文仍在
function onListInput(e) {
  if (editing && e.target.matches("textarea")) editing.value = e.target.value;
}

$("#list").addEventListener("input", onListInput);
$("#pinList").addEventListener("input", onListInput);

$("#pinBar").addEventListener("click", () => {
  pinnedOpen = !pinnedOpen;
  render();
});

function onListClick(e) {
  const card = e.target.closest(".memory");
  if (!card) return;
  const key = card.dataset.key;
  const idx = state.findIndex((m) => m.key === key);
  if (idx === -1) return;

  if (e.target.classList.contains("editBtn")) {
    const contentEl = card.querySelector(".content");
    editing = {
      key,
      value: state[idx].content,
      height: contentEl ? contentEl.offsetHeight : 0, // 编辑框初始高度 = 浏览时的内容高度
    };
    render();
  } else if (e.target.classList.contains("saveBtn")) {
    const content = (editing ? editing.value : "").trim();
    if (!content) return;
    const item = state[idx];
    editing = null;
    // 乐观保存：立即退出编辑态、按最新时间排到所属分区首位
    state.splice(idx, 1);
    item.content = content;
    item.updated_at = nowShanghai();
    item.pending = true;
    insertByOrder(state, item);
    render();
    enqueue(async () => {
      try {
        // id 延迟到执行时解析：若该卡片还在等新增落库，此时已能拿到服务端 id
        const id = pendingIds[item.key] || item.id;
        await api(`/api/memories/${id}`, { method: "PUT", body: JSON.stringify({ content }) });
        if (state.includes(item)) item.pending = false;
        await load();
      } catch (err) {
        showError(err.message);
        await load().catch(() => {});
      }
    });
  } else if (e.target.classList.contains("cancelBtn")) {
    editing = null;
    render();
  } else if (e.target.classList.contains("delBtn")) {
    if (!confirm("确定删除这条记忆吗？")) return;
    const item = state[idx];
    state.splice(idx, 1);
    if (editing && editing.key === key) editing = null;
    render();
    enqueue(async () => {
      try {
        const id = pendingIds[item.key] || item.id;
        await api(`/api/memories/${id}`, { method: "DELETE" });
        await load();
      } catch (err) {
        showError(err.message);
        await load().catch(() => {});
      }
    });
  }
}

$("#list").addEventListener("click", onListClick);
$("#pinList").addEventListener("click", onListClick);

$("#pager").addEventListener("click", (e) => {
  if (e.target.id === "prevPage" && page > 1) {
    page--;
    render();
  } else if (e.target.id === "nextPage" && page < Math.ceil(state.filter((m) => !m.pinned).length / PAGE_SIZE)) {
    page++;
    render();
  }
});

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  try {
    await api("/api/login", {
      method: "POST",
      body: JSON.stringify({ password: $("#pw").value }),
    });
    $("#pw").value = "";
    showApp();
    await load();
  } catch (err) {
    if (err.message !== "unauthorized") $("#loginErr").textContent = err.message;
    else $("#loginErr").textContent = "密码错误";
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  await api("/api/logout", { method: "POST" });
  showLogin();
});

(async () => {
  const status = await api("/api/auth_status").catch(() => null);
  if (status && status.auth_required && !status.authed) {
    showLogin();
  } else {
    showApp();
    if (status && status.auth_required) $("#logoutBtn").hidden = false;
    await load();
  }
})();
</script>
</body>
</html>
