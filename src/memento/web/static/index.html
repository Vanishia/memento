<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memento</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light dark;
    --page: #f5f5f3;
    --surface: #fff;
    --ink: #202020;
    --muted: #737373;
    --line: #dededb;
    --hover: #ebebe8;
    --accent: #202020;
    --on-accent: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #141414;
      --surface: #1c1c1c;
      --ink: #e8e8e5;
      --muted: #999996;
      --line: #363635;
      --hover: #2c2c2b;
      --accent: #e8e8e5;
      --on-accent: #141414;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    max-width: 760px; margin: 0 auto; padding: 48px 24px 64px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.65;
    background: var(--page); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-size: 22px; font-weight: 600; letter-spacing: -0.7px;
    margin: 0 0 28px; padding-bottom: 20px; border-bottom: 1px solid var(--ink);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .brand { display: inline-flex; align-items: center; gap: 9px; }
  .brand svg { width: 26px; height: 26px; flex: none; }
  .header-tools { display: flex; align-items: center; gap: 8px; }
  textarea, input {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 0;
  }
  textarea {
    display: block; width: 100%; min-height: 124px; padding: 16px 18px 60px;
    resize: vertical; line-height: 1.75;
  }
  textarea::placeholder, input::placeholder { color: var(--muted); opacity: 1; }
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 14px; font: inherit; line-height: 1.4;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 0; cursor: pointer;
    touch-action: manipulation;
  }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button:hover { background: var(--hover); border-color: var(--muted); }
  button.primary:hover { background: var(--ink); opacity: 0.8; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  textarea:focus-visible, input:focus-visible { outline-offset: -1px; }
  .icon-btn { width: 34px; height: 34px; padding: 0; flex: none; }
  .icon-btn svg { width: 17px; height: 17px; pointer-events: none; }
  .editor { position: relative; }
  .editor-tools {
    position: absolute; right: 10px; bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .new-box { margin-bottom: 28px; }
  .memory {
    position: relative; background: var(--surface); border: 1px solid var(--line);
    padding: 18px 20px 12px; margin-bottom: 12px;
  }
  .memory .date {
    min-height: 22px; margin-bottom: 9px; padding-right: 30px;
    font-size: 11px; color: var(--muted); letter-spacing: 0.4px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .memory .content { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.85; }
  .memory .actions { display: flex; gap: 16px; margin-top: 12px; }
  .memory .actions button {
    padding: 4px 0; border: 0; background: transparent; color: var(--muted); font-size: 12px;
  }
  .memory .actions button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
  .memory .actions .danger:hover { text-decoration-style: double; }
  .memory.editing-card { padding: 0; border: 0; }
  .memory.editing-card textarea { min-height: 148px; }
  .editor-tools .cancelBtn { font-size: 12px; border-color: transparent; color: var(--muted); }
  #login { max-width: 320px; margin: 16vh auto; }
  #login h1 { justify-content: center; }
  #login input { width: 100%; padding: 11px 12px; margin-bottom: 12px; }
  #login button { width: 100%; padding: 11px; }
  .error { color: var(--ink); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; font-size: 13px; }
  #logoutBtn { color: var(--muted); background: transparent; border-color: transparent; }
  #logoutBtn:hover { color: var(--ink); background: var(--hover); }
  #sync { font-size: 11px; color: var(--muted); font-weight: normal; letter-spacing: 0; }
  .memory.pending { opacity: 0.55; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    max-width: calc(100% - 32px); width: max-content;
    background: var(--ink); color: var(--surface); border: 1px solid var(--muted);
    padding: 12px 18px; font-size: 13px; z-index: 10;
  }
  .pager {
    display: flex; justify-content: center; align-items: center;
    gap: 16px; margin: 28px 0 8px; font-size: 12px; color: var(--muted);
    padding-top: 20px; border-top: 1px solid var(--line);
  }
  .pager button { font-size: 12px; padding: 6px 10px; background: transparent; }
  .pin-bar {
    width: 100%; justify-content: flex-start; gap: 8px;
    margin-bottom: 12px; padding: 12px 0; font-size: 12px; color: var(--muted);
    background: transparent; border: 0; border-bottom: 1px solid var(--line);
    text-align: left;
  }
  .pin-bar:hover { background: transparent; color: var(--ink); }
  #pinArrow { font-size: 8px; width: 12px; }
  .memory.pinned-card { border-left: 3px solid var(--ink); padding-left: 18px; }
  .pinBtn {
    position: absolute; top: 10px; right: 10px;
    border-color: transparent; background: transparent; color: var(--muted);
  }
  .pinBtn[aria-pressed="true"] { color: var(--ink); background: var(--hover); }
  #pinList:not(:empty) { margin-bottom: 24px; }
  #searchBtn { border-color: transparent; background: transparent; color: var(--muted); }
  #searchBtn[aria-expanded="true"], #searchBtn:hover { color: var(--ink); background: var(--hover); }
  .search-panel { padding: 16px; margin-bottom: 24px; border: 1px solid var(--line); background: var(--surface); }
  .search-query { display: flex; gap: 8px; }
  .search-query input { flex: 1; min-width: 0; padding: 8px 10px; }
  .search-query .icon-btn { width: 40px; height: 40px; }
  .search-dates { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .search-dates label { flex: 1; min-width: 120px; color: var(--muted); font-size: 12px; }
  .search-dates input { display: block; width: 100%; min-width: 0; padding: 6px 8px; margin-top: 4px; }
  .search-help { color: var(--muted); font-size: 11px; margin: 12px 0 0; }
  .search-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  #searchStatus { font-size: 12px; color: var(--muted); margin: 0; }
  #clearSearchBtn { font-size: 12px; flex: none; background: transparent; }
  @media (max-width: 480px) {
    body { padding: 24px 16px 40px; }
    h1 { margin-bottom: 20px; font-size: 20px; }
    .memory { padding: 16px 16px 10px; }
    .memory.pinned-card { padding-left: 14px; }
    .pager { gap: 10px; }
    .pager button { padding: 6px 8px; }
  }
</style>
</head>
<body>

<div id="login" hidden>
  <h1><span class="brand">Memento <svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 32a17 10.5 0 1 0 34 0 17 10.5 0 1 0-34 0ZM17.9 29a2.6 2.6 0 1 0 5.2 0 2.6 2.6 0 1 0-5.2 0Z"/><path fill="currentColor" d="M43 32l13-9v18z"/></svg></span></h1>
  <form id="loginForm">
    <input type="password" id="pw" aria-label="密码" placeholder="密码" autocomplete="current-password" required>
    <button class="primary" type="submit">登录</button>
    <p class="error" id="loginErr"></p>
  </form>
</div>

<main id="app" hidden>
  <h1>
    <span class="brand">Memento <svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 32a17 10.5 0 1 0 34 0 17 10.5 0 1 0-34 0ZM17.9 29a2.6 2.6 0 1 0 5.2 0 2.6 2.6 0 1 0-5.2 0Z"/><path fill="currentColor" d="M43 32l13-9v18z"/></svg></span>
    <span class="header-tools">
      <span id="sync" hidden>同步中…</span>
      <button id="searchBtn" class="icon-btn" title="搜索记忆" aria-label="搜索记忆" aria-expanded="false" aria-controls="searchPanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
      <button id="logoutBtn" class="icon-btn" hidden title="退出登录" aria-label="退出登录"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg></button>
    </span>
  </h1>
  <div class="new-box editor">
    <textarea id="newContent" placeholder="记一条……" aria-label="新记忆"></textarea>
    <div class="editor-tools">
      <button class="primary icon-btn" id="addBtn" title="保存记忆" aria-label="保存记忆"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M19 21H3V3h14l4 4v14h-2ZM7 3v6h10V3M7 21v-8h10v8"/></svg></button>
    </div>
  </div>
  <form id="searchPanel" class="search-panel" role="search" hidden>
    <div class="search-query">
      <input id="searchKeyword" type="search" placeholder="搜索记忆……" aria-label="搜索关键词" aria-describedby="searchHelp">
      <button type="submit" class="primary icon-btn" title="搜索" aria-label="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
    </div>
    <div class="search-dates">
      <label>开始日期<input id="searchSince" type="date"></label>
      <label>结束日期<input id="searchUntil" type="date"></label>
    </div>
    <p id="searchHelp" class="search-help">按创建日期筛选；不填关键词时，请至少选一个日期。</p>
  </form>
  <section id="searchView" aria-label="搜索结果" hidden>
    <div class="search-summary">
      <p id="searchStatus" role="status"></p>
      <button id="clearSearchBtn">返回全部</button>
    </div>
    <div id="searchResults"></div>
  </section>
  <button id="pinBar" class="pin-bar" aria-controls="pinList" hidden><span id="pinArrow">▶</span> 置顶记忆（<span id="pinCount">0</span> 条）</button>
  <div id="pinList"></div>
  <div id="list"></div>
  <div id="pager" class="pager" hidden></div>
</main>
<div id="toast" role="status" hidden></div>

<script>
const $ = (s) => document.querySelector(s);

// 本地状态是渲染的唯一来源：写操作先改本地、立即渲染，请求放后台队列串行执行，
// 回来后再拉全量对账，因此跨洋高延迟不会阻塞操作。
let state = [];
let editing = null;              // 正在编辑的卡片 {key, value}，保证后台刷新不打断输入
const pendingIds = {};           // 乐观新增的临时 key → 服务端 id
let queue = Promise.resolve();   // 写请求串行队列，防止并发乱序
let inFlight = 0;                // 队列中未完成的请求数，驱动"同步中"指示
const PAGE_SIZE = 10;            // 列表每页条数（置顶板块不计入分页）
let page = 1;
let pinnedOpen = false;          // 置顶板块默认折叠，条上显示数量
const unpinnedOrder = new Map(); // 本次浏览中取消置顶的条目临时排在普通列表前面
let unpinSequence = 0;
const pendingDeletes = new Set(); // 防止在途搜索响应把乐观删除的条目重新放回列表
let searchState = null;          // 搜索结果保留后端相关性顺序，不混入普通列表的排序
let searchRequest = 0;           // 只接受最新请求，关闭搜索时也使在途响应失效

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!res.ok) {
    let msg = res.statusText || `HTTP ${res.status}`;
    try { msg = (await res.json()).detail || msg; } catch {}
    if (res.status === 429) msg = "尝试太频繁，请稍后再试";  // nginx 返回的 429 是 HTML 页、statusText 为空
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}

function showLogin() {
  $("#login").hidden = false;
  $("#app").hidden = true;
}

function showApp() {
  $("#login").hidden = true;
  $("#app").hidden = false;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function updateSyncUI() {
  $("#sync").hidden = inFlight === 0;
}

// 写操作进队列串行执行；单条失败不阻断后续，错误提示与回滚由 op 自己处理
function enqueue(op) {
  inFlight++;
  updateSyncUI();
  queue = queue.then(op).catch(() => {}).finally(() => {
    inFlight--;
    updateSyncUI();
  });
}

// 服务端时间戳格式（东八区）的本地近似，仅用于乐观渲染占位，同步后以服务端为准
function nowShanghai() {
  const n = new Date();
  const s = new Date(n.getTime() + (n.getTimezoneOffset() + 480) * 60000);
  const p = (x) => String(x).padStart(2, "0");
  return `${s.getUTCFullYear()}-${p(s.getUTCMonth() + 1)}-${p(s.getUTCDate())} ` +
    `${p(s.getUTCHours())}:${p(s.getUTCMinutes())}:${p(s.getUTCSeconds())}`;
}

// 与服务端 ORDER BY pinned DESC, updated_at DESC, id DESC 一致
function cmpServer(a, b) {
  if (!!b.pinned !== !!a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
  if (a.updated_at !== b.updated_at) return a.updated_at < b.updated_at ? 1 : -1;
  if (a.id === b.id) return 0;
  return a.id < b.id ? 1 : -1;
}

function insertByOrder(arr, item) {
  const i = arr.findIndex((m) => cmpServer(m, item) > 0);
  arr.splice(i === -1 ? arr.length : i, 0, item);
}

function cardHTML(m) {
  if (editing && editing.key === m.key) {
    return `
    <div class="memory editing-card" data-key="${esc(m.key)}">
      <div class="editor">
        <textarea aria-label="编辑记忆">${esc(editing.value)}</textarea>
        <div class="editor-tools">
          <button class="cancelBtn">取消</button>
          <button class="primary icon-btn saveBtn" title="保存修改" aria-label="保存修改"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M19 21H3V3h14l4 4v14h-2ZM7 3v6h10V3M7 21v-8h10v8"/></svg></button>
        </div>
      </div>
    </div>`;
  }
  // 显示创建日期（改过的话补一个更新日期）；排序用 updated_at，与服务端 ORDER BY 一致
  const created = (m.created_at || "").slice(0, 10);
  const updated = (m.updated_at || "").slice(0, 10);
  const stamp = created && created !== updated ? `${created}→${updated}` : created || updated;
  const dateLine = m.pending ? "同步中…" : `${esc(stamp)} · #${esc(m.id)}`;
  const cls = `${m.pending ? " pending" : ""}${m.pinned ? " pinned-card" : ""}`;
  return `
    <div class="memory${cls}" data-key="${esc(m.key)}">
      <div class="date">${dateLine}</div>
      <button class="pinBtn icon-btn" title="${m.pinned ? '取消置顶' : '置顶'}" aria-label="${m.pinned ? '取消置顶' : '置顶'}" aria-pressed="${!!m.pinned}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 5 5-4 1-4 4v4l-2 2-6-6 2-2h4l4-4zM8 16l-5 5"/></svg></button>
      <div class="content">${esc(m.content)}</div>
      <div class="actions"><button class="editBtn">编辑</button><button class="danger delBtn">删除</button></div>
    </div>`;
}

function render() {
  // 置顶板块：默认折叠，条上显示置顶数量
  const pinnedItems = state.filter((m) => !!m.pinned);
  const normalItems = state.filter((m) => !m.pinned).sort((a, b) =>
    (unpinnedOrder.get(b.id || b.key) || 0) - (unpinnedOrder.get(a.id || a.key) || 0));
  const bar = $("#pinBar");
  if (pinnedItems.length) {
    bar.hidden = false;
    $("#pinCount").textContent = pinnedItems.length;
    $("#pinArrow").textContent = pinnedOpen ? "▼" : "▶";
    bar.setAttribute("aria-expanded", String(pinnedOpen));
    $("#pinList").innerHTML = pinnedOpen ? pinnedItems.map(cardHTML).join("") : "";
  } else {
    bar.hidden = true;
    $("#pinList").innerHTML = "";
  }

  const list = $("#list");
  const pager = $("#pager");
  if (!normalItems.length) {
    list.innerHTML = state.length
      ? '<div class="empty">没有更多记忆了</div>'
      : '<div class="empty">还没有任何记忆</div>';
    pager.hidden = true;
    pager.innerHTML = "";
  } else {
    const totalPages = Math.max(1, Math.ceil(normalItems.length / PAGE_SIZE));
    if (page > totalPages) page = totalPages; // 删除后页数收缩，收敛页码
    list.innerHTML = normalItems
      .slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE)
      .map(cardHTML).join("");
    if (totalPages > 1) {
      pager.hidden = false;
      pager.innerHTML =
        `<button id="prevPage" ${page <= 1 ? "disabled" : ""}>上一页</button>` +
        `<span>第 ${page} / ${totalPages} 页 · 共 ${normalItems.length} 条</span>` +
        `<button id="nextPage" ${page >= totalPages ? "disabled" : ""}>下一页</button>`;
    } else {
      pager.hidden = true;
      pager.innerHTML = "";
    }
  }
  const searching = searchState !== null;
  $("#searchView").hidden = !searching;
  $("#list").hidden = searching;
  $("#pinList").hidden = searching;
  if (searching) {
    bar.hidden = true;
    pager.hidden = true;
    const { items, loading, error, may_have_more, limit } = searchState;
    $("#searchView").setAttribute("aria-busy", String(loading));
    $("#searchStatus").textContent = loading ? "搜索中…" : error ||
      (may_have_more ? `显示前 ${limit} 条，可能还有更多，请缩小搜索范围` : `找到 ${items.length} 条记忆`);
    // 结果的内容来自本地状态，所以编辑、删除、置顶仍可立即生效。
    const results = items.map((m) => state.find((s) => s.id === m.id)).filter(Boolean);
    $("#searchResults").innerHTML = results.map(cardHTML).join("") ||
      (!loading && !error ? '<div class="empty">没有匹配的记忆</div>' : "");
  } else {
    $("#searchResults").innerHTML = "";
  }
  if (editing) {
    const container = searching ? $("#searchResults") : state.find((m) => m.key === editing.key)?.pinned ? $("#pinList") : list;
    const ta = container.querySelector(`[data-key="${editing.key}"] textarea`);
    if (ta) {
      if (editing.height) ta.style.height = editing.height + "px";
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }
}

// 拉服务端全量对账；尚未被服务端确认的乐观条目保留本地（按服务端顺序插入）
async function load() {
  const data = await api("/api/memories");
  // 还有排队的写操作时，本地包含更新的意图，最后一个操作完成后再统一对账。
  if (inFlight > 1) return;
  const serverItems = data.map((m) => ({ ...m, key: m.id, pending: false }));
  const carried = [];
  for (const p of state) {
    if (!p.pending) continue;
    const rid = pendingIds[p.key];
    if (rid && serverItems.some((m) => m.id === rid)) continue; // 服务端已有，以服务端为准
    carried.push(p);
  }
  state = serverItems;
  for (const p of carried) insertByOrder(state, p);
  render();
  if (searchState) await runSearch(searchState.params, true);
}

async function runSearch(params, refreshing = false) {
  const request = ++searchRequest;
  searchState = {
    params, items: refreshing && searchState ? searchState.items : [],
    loading: true, error: "", may_have_more: false,
  };
  render();
  try {
    const result = await api(`/api/memories/search?${new URLSearchParams(params)}`);
    if (request !== searchRequest) return;
    // MCP 或其他客户端可能在页面打开后新增/修改记忆，搜索结果也要可见、可操作。
    for (const m of result.items) {
      if (pendingDeletes.has(m.id)) continue;
      const local = state.find((s) => s.id === m.id);
      if (!local) insertByOrder(state, { ...m, key: m.id, pending: false });
      else if (inFlight === 0) Object.assign(local, m);
    }
    searchState = { params, ...result, loading: false, error: "" };
  } catch (err) {
    if (request !== searchRequest) return;
    searchState = { params, items: [], loading: false, error: `搜索失败：${err.message}` };
  }
  render();
}

function closeSearch() {
  ++searchRequest;
  searchState = null;
  $("#searchPanel").hidden = true;
  $("#searchBtn").setAttribute("aria-expanded", "false");
  render();
  $("#searchBtn").focus();
}

$("#searchBtn").addEventListener("click", () => {
  if (!$("#searchPanel").hidden) return closeSearch();
  $("#searchPanel").hidden = false;
  $("#searchBtn").setAttribute("aria-expanded", "true");
  $("#searchKeyword").focus();
});

$("#searchPanel").addEventListener("submit", (e) => {
  e.preventDefault();
  runSearch({
    keyword: $("#searchKeyword").value.trim(),
    since: $("#searchSince").value,
    until: $("#searchUntil").value,
  });
});
$("#searchPanel").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); closeSearch(); }
});
$("#clearSearchBtn").addEventListener("click", closeSearch);

let toastTimer = null;
function showError(msg) {
  const t = $("#toast");
  t.textContent = `操作失败：${msg}（已恢复服务端状态）`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
}

// 乐观新增：立即上屏（半透明 + "同步中…"），后台落库
$("#addBtn").addEventListener("click", () => {
  const content = $("#newContent").value.trim();
  if (!content) return;
  $("#newContent").value = "";
  const item = {
    key: `tmp-${Math.random().toString(36).slice(2, 8)}`,
    id: "",
    content,
    created_at: "",
    updated_at: nowShanghai(),
    pinned: 0,
    pending: true,
  };
  insertByOrder(state, item);
  page = 1; // 新记忆排在最前，跳回第一页
  render();
  enqueue(async () => {
    try {
      const res = await api("/api/memories", { method: "POST", body: JSON.stringify({ content }) });
      pendingIds[item.key] = res.id;
      if (unpinnedOrder.has(item.key)) {
        unpinnedOrder.set(res.id, unpinnedOrder.get(item.key));
        unpinnedOrder.delete(item.key);
      }
      if (state.includes(item)) {
        item.id = res.id;
        item.pending = false;
      }
      await load();
    } catch (err) {
      // 新增失败：撤下乐观卡片，输入内容归还文本框
      if (state.includes(item)) state.splice(state.indexOf(item), 1);
      if (!$("#newContent").value.trim()) $("#newContent").value = content;
      render();
      showError(err.message);
    }
  });
});

// 编辑中的输入实时同步到 editing，后台对账刷新后原文仍在
function onListInput(e) {
  if (editing && e.target.matches("textarea")) editing.value = e.target.value;
}

$("#list").addEventListener("input", onListInput);
$("#pinList").addEventListener("input", onListInput);
$("#searchResults").addEventListener("input", onListInput);

$("#pinBar").addEventListener("click", () => {
  pinnedOpen = !pinnedOpen;
  render();
});

function onListClick(e) {
  const button = e.target.closest("button");
  if (!button) return;
  const card = e.target.closest(".memory");
  if (!card) return;
  const key = card.dataset.key;
  const idx = state.findIndex((m) => m.key === key);
  if (idx === -1) return;

  if (button.classList.contains("pinBtn")) {
    const item = state[idx];
    const pinned = !item.pinned;
    const orderKey = item.id || item.key;
    const previousOrder = unpinnedOrder.get(orderKey);
    item.pinned = pinned;
    item.pending = true;
    if (pinned) {
      unpinnedOrder.delete(orderKey);
      pinnedOpen = true;
    } else {
      unpinnedOrder.set(orderKey, ++unpinSequence);
      page = 1;
    }
    render();
    enqueue(async () => {
      try {
        const id = pendingIds[item.key] || item.id;
        await api(`/api/memories/${id}/pin`, {
          method: "PUT", body: JSON.stringify({ pinned }),
        });
        if (state.includes(item)) item.pending = false;
        await load();
      } catch (err) {
        const id = pendingIds[item.key] || item.id || item.key;
        if (state.includes(item)) {
          item.pinned = !pinned;
          item.pending = false;
        }
        if (previousOrder === undefined) unpinnedOrder.delete(id);
        else unpinnedOrder.set(id, previousOrder);
        render();
        showError(err.message);
        await load().catch(() => {});
      }
    });
  } else if (button.classList.contains("editBtn")) {
    const contentEl = card.querySelector(".content");
    editing = {
      key,
      value: state[idx].content,
      height: contentEl ? contentEl.offsetHeight : 0, // 编辑框初始高度 = 浏览时的内容高度
    };
    render();
  } else if (button.classList.contains("saveBtn")) {
    const content = (editing ? editing.value : "").trim();
    if (!content) return;
    const item = state[idx];
    editing = null;
    // 乐观保存：立即退出编辑态、按最新时间排到所属分区首位
    state.splice(idx, 1);
    item.content = content;
    item.updated_at = nowShanghai();
    item.pending = true;
    insertByOrder(state, item);
    render();
    enqueue(async () => {
      try {
        // id 延迟到执行时解析：若该卡片还在等新增落库，此时已能拿到服务端 id
        const id = pendingIds[item.key] || item.id;
        await api(`/api/memories/${id}`, { method: "PUT", body: JSON.stringify({ content }) });
        if (state.includes(item)) item.pending = false;
        await load();
      } catch (err) {
        showError(err.message);
        await load().catch(() => {});
      }
    });
  } else if (button.classList.contains("cancelBtn")) {
    editing = null;
    render();
  } else if (button.classList.contains("delBtn")) {
    if (!confirm("确定删除这条记忆吗？")) return;
    const item = state[idx];
    pendingDeletes.add(item.id);
    state.splice(idx, 1);
    if (editing && editing.key === key) editing = null;
    render();
    enqueue(async () => {
      try {
        const id = pendingIds[item.key] || item.id;
        await api(`/api/memories/${id}`, { method: "DELETE" });
        await load();
      } catch (err) {
        showError(err.message);
        await load().catch(() => {});
      } finally {
        pendingDeletes.delete(item.id);
      }
    });
  }
}

$("#list").addEventListener("click", onListClick);
$("#pinList").addEventListener("click", onListClick);
$("#searchResults").addEventListener("click", onListClick);

$("#pager").addEventListener("click", (e) => {
  if (e.target.id === "prevPage" && page > 1) {
    page--;
    render();
  } else if (e.target.id === "nextPage" && page < Math.ceil(state.filter((m) => !m.pinned).length / PAGE_SIZE)) {
    page++;
    render();
  }
});

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  try {
    await api("/api/login", {
      method: "POST",
      body: JSON.stringify({ password: $("#pw").value }),
    });
    $("#pw").value = "";
    showApp();
    $("#logoutBtn").hidden = false;
    await load();
  } catch (err) {
    if (err.message !== "unauthorized") $("#loginErr").textContent = err.message;
    else $("#loginErr").textContent = "密码错误";
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  await api("/api/logout", { method: "POST" });
  showLogin();
});

(async () => {
  const status = await api("/api/auth_status").catch(() => null);
  if (status && status.auth_required && !status.authed) {
    showLogin();
  } else {
    showApp();
    if (status && status.auth_required) $("#logoutBtn").hidden = false;
    await load();
  }
})();
</script>
</body>
</html>
